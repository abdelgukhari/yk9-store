services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yk9}
      POSTGRES_USER: ${POSTGRES_USER:-yk9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yk9}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yk9} -d ${POSTGRES_DB:-yk9}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-yk9}
      POSTGRES_USER: ${POSTGRES_USER:-yk9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yk9}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      VODAFONE_CASH_NUMBER: ${VODAFONE_CASH_NUMBER:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-600}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - yk9_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- -H 0.0.0.0

volumes:
  pgdata: {}
  yk9_media: {}
