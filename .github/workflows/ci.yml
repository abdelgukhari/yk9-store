name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yk9_test
          POSTGRES_USER: yk9
          POSTGRES_PASSWORD: yk9
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yk9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Django system check
        env:
          POSTGRES_DB: yk9_test
          POSTGRES_USER: yk9
          POSTGRES_PASSWORD: yk9
          POSTGRES_HOST: 127.0.0.1
        run: |
          cd backend
          python manage.py check
      - name: Django tests
        env:
          POSTGRES_DB: yk9_test
          POSTGRES_USER: yk9
          POSTGRES_PASSWORD: yk9
          POSTGRES_HOST: 127.0.0.1
        run: |
          cd backend
          python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
